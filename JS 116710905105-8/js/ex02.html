<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number in Range</title>
</head>
<body>
    <script>
    const random_Number_In_Range = (min,max) => Math.random() * (max-min) + min;

    console.log(random_Number_In_Range(1, 3));
    console.log(random_Number_In_Range(10, 100)); 
</script>
</body>
</html>
