<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Example</title>
    <style>
        body { font-family: Georgia, serif; margin: 0; padding: 20px; }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .gallery img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="gallery">
        <img src="ดอกไม้.png" alt="Flower 1">
        <img src="ดอกไม้2.png" alt="Flower 2">
        <img src="ดอกไม้3.png" alt="Flower 3">
        <img src="ดอกไม้4.png" alt="Flower 4">
        <img src="ดอกไม้5.png" alt="Flower 5">
        <img src="ดอกไม้6.png" alt="Flower 6">
    </div>

</body>
</html>
